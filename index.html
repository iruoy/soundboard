<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbbf23" />
    <script>
      // Apply a stored theme before first paint; src/theme.tsx keeps it in sync afterwards.
      try {
        const theme = localStorage.getItem("sb-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Soundboard</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/home.tsx"></script>
  </body>
</html>
