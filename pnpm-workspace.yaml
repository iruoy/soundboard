catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
packageExtensions:
  # Only geist's font files are used, not its next/font wrappers, so don't pull in Next.
  geist:
    peerDependenciesMeta:
      next:
        optional: true
permissions:
  "@solidjs/web":
    skills: true
  solid-js:
    skills: true
skills:
  dirs:
    - .agents/skills
minimumReleaseAgeExclude:
  - "@solidjs/signals@2.0.0-rc.21"
  - "@solidjs/web@2.0.0-rc.21"
  - solid-js@2.0.0-rc.21
